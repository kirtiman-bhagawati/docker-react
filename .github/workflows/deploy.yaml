name: Deploy Frontend
on: [push, pull_request]
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t kirtimanb23/react-test -f Dockerfile.dev .
      - run: docker run -e CI=true kirtimanb23/react-test npm test


      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'
 
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: frontend-docker-tutorial
          environment_name: Frontend-docker-tutorial-env
          existing_bucket_name: elasticbeanstalk-us-east-1-381492240165
          region: us-east-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip